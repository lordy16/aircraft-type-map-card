<!doctype html><html><head><meta charset="utf-8"><style>
 body{margin:0;padding:16px;background:var(--bg);font-family:system-ui}
 body.dark{--bg:#111;--card-background-color:#1c1c1c;--primary-text-color:#e1e1e1;--primary-color:#03a9f4}
 body.light{--bg:#f2f2f2;--card-background-color:#fff;--primary-text-color:#212121;--primary-color:#03a9f4}
 #slot{width:860px}
</style></head><body><div id="slot"></div>
<script>
 customElements.define('ha-card', class extends HTMLElement{ connectedCallback(){ this.style.display='block'; this.style.background='var(--card-background-color)'; this.style.borderRadius='12px'; this.style.overflow='hidden'; const h=this.getAttribute('header'); if(h&&!this._h){this._h=1; const d=document.createElement('div'); d.textContent=h; d.style.cssText='padding:12px 16px;font-size:20px;color:var(--primary-text-color)'; this.prepend(d);} } });
</script>
<script type="module" src="/aircraft-type-map-card.js"></script>
</body></html>
